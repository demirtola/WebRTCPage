<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Görüntülü Arama Testi</title>
</head>
<body>
    <div>
        <input type="text" id="call-id" placeholder="Aranacak Kişinin ID'si">
        <button id="call-btn">Görüntülü Ara</button>
    </div>

    <div style="margin-top: 20px;">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
    </div>

    <!-- PeerJS Kütüphanesini Eklemeyi Unutma -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        // PeerJS Sunucusuna (Docker - vds.demirtola.net) ve Coturn (TURN/STUN) Sunucusuna Bağlanıyoruz
        const peer = new Peer({
            host: 'vds.demirtola.net', 
            port: 9000,
            secure: true,              // WSS / HTTPS aktif!
            path: '/',
            config: {
                iceServers: [
                    { urls: 'stun:vds.demirtola.net:3478' },
                    {
                        urls: 'turn:vds.demirtola.net:3478',
                        username: 'mete', 
                        credential: '684424'      
                    },
                    {
                        urls: 'turn:ssh2.demirtola.net:3478', // İstersen bunu da tutabilirsin
                        username: 'mete', 
                        credential: '684424'      
                    }
                ]
            }
        });

        let localStream;
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        // Bağlantı başarılı olduğunda (Eskiden aldığın kod burada dönecek)
        peer.on('open', (id) => {
            console.log('Peer başarıyla bağlandı. ID:', id);
            alert('Signal sunucusuna bağlandı! Peer ID: ' + id);
        });

        // Hata durumunu yakalamak için
        peer.on('error', (err) => {
            console.error('PeerJS Hatası:', err);
            alert('Bağlantı Hatası: ' + err.type);
        });

        // 1. Kendi Kameramızı ve Mikrofonumuzu Açıyoruz
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                console.error('Kamera hatası:', err);
                alert('Kamera ve mikrofon izni vermelisiniz!');
            });
    </script>
</body>
</html>
